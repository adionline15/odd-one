<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Odd-One.in — India Road Intelligence</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body { height:100%; width:100%; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; overflow:hidden; }

/* MAP */
#map { position:fixed; top:0; left:0; right:0; bottom:0; z-index:1; }

/* TOP BAR */
.topbar {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  background:#fff;
  border-bottom:1px solid #E2E0D8;
  padding:8px 12px;
  display:flex; align-items:center; gap:8px;
  height:52px;
  box-shadow:0 1px 8px rgba(0,0,0,0.08);
}
.logo { font-size:15px; font-weight:700; color:#1a1a1a; white-space:nowrap; flex-shrink:0; }
.logo em { font-style:normal; color:#E24B4A; }
.search-wrap { flex:1; position:relative; }
.search-wrap input {
  width:100%; padding:8px 36px 8px 12px;
  border:1.5px solid #E2E0D8; border-radius:20px;
  font-size:14px; outline:none; background:#F7F5F0;
  font-family:inherit; color:#1a1a1a;
  -webkit-appearance:none;
}
.search-wrap input:focus { border-color:#185FA5; background:#fff; }
.search-icon { position:absolute; right:10px; top:50%; transform:translateY(-50%); font-size:14px; color:#aaa; }

/* SUGGESTIONS */
.sugg {
  position:absolute; top:100%; left:0; right:0;
  background:#fff; border:1px solid #E2E0D8; border-top:none;
  border-radius:0 0 12px 12px;
  box-shadow:0 4px 16px rgba(0,0,0,0.12);
  z-index:2000; display:none; max-height:220px; overflow-y:auto;
}
.sugg-item {
  padding:11px 14px; font-size:14px; cursor:pointer;
  border-bottom:1px solid #F7F5F0; color:#333;
  display:flex; align-items:center; gap:8px;
  min-height:44px;
}
.sugg-item:active { background:#F7F5F0; }
.sugg-item:last-child { border-bottom:none; }

/* BOTTOM SHEET */
.bottom-sheet {
  position:fixed; bottom:0; left:0; right:0; z-index:900;
  background:#fff;
  border-radius:20px 20px 0 0;
  box-shadow:0 -4px 24px rgba(0,0,0,0.12);
  transform:translateY(calc(100% - 60px));
  transition:transform 0.3s ease;
  max-height:80vh;
  display:flex; flex-direction:column;
}
.bottom-sheet.open { transform:translateY(0); }
.bottom-sheet.mid { transform:translateY(40%); }

.sheet-handle {
  width:36px; height:4px; background:#E2E0D8; border-radius:2px;
  margin:10px auto 0; flex-shrink:0; cursor:pointer;
}

.sheet-tabs {
  display:flex; border-bottom:1px solid #E2E0D8; flex-shrink:0;
  padding:0 4px;
}
.sheet-tab {
  flex:1; padding:10px 0; text-align:center;
  font-size:12px; font-weight:500; color:#999;
  cursor:pointer; border-bottom:2px solid transparent;
  min-height:44px; display:flex; align-items:center; justify-content:center;
}
.sheet-tab.on { color:#185FA5; border-bottom-color:#185FA5; }

.sheet-content { flex:1; overflow-y:auto; padding:14px; }
.sheet-content::-webkit-scrollbar { display:none; }

.tab-pane { display:none; }
.tab-pane.on { display:block; }

/* ALERTS */
.alert-card {
  background:#fff; border:1px solid #E2E0D8;
  border-left:3px solid #E24B4A;
  border-radius:10px; padding:12px 14px; margin-bottom:10px;
}
.alert-card.medium { border-left-color:#D97706; }
.alert-card.low { border-left-color:#185FA5; }
.alert-title { font-size:13px; font-weight:500; line-height:1.4; margin-bottom:4px; color:#1a1a1a; }
.alert-meta { font-size:11px; color:#aaa; }

/* ROUTE FORM */
.field { margin-bottom:12px; }
.field label { font-size:10px; font-weight:600; color:#aaa; text-transform:uppercase; letter-spacing:.06em; display:block; margin-bottom:5px; }
.field input {
  width:100%; padding:12px 14px;
  border:1.5px solid #E2E0D8; border-radius:12px;
  font-size:15px; font-family:inherit; outline:none; color:#1a1a1a;
  -webkit-appearance:none; min-height:48px;
}
.field input:focus { border-color:#185FA5; }
.go-btn {
  width:100%; background:#185FA5; color:#fff; border:none;
  border-radius:12px; padding:14px; font-size:15px;
  font-weight:600; cursor:pointer; font-family:inherit;
  margin-top:4px; min-height:50px;
}
.go-btn:disabled { background:#ccc; }

/* ROUTE RESULT */
.route-stats {
  display:flex; gap:12px; background:#F7F5F0;
  border-radius:12px; padding:14px; margin-top:12px;
}
.route-stat { flex:1; text-align:center; }
.route-stat-n { font-size:20px; font-weight:700; color:#1a1a1a; }
.route-stat-l { font-size:10px; color:#aaa; margin-top:2px; }

.ai-box {
  background:#EEF3FF; border:1px solid #BFCFFF;
  border-radius:12px; padding:14px; margin-top:12px;
}
.ai-label { font-size:10px; font-weight:700; color:#185FA5; text-transform:uppercase; margin-bottom:8px; }
.ai-text { font-size:13px; line-height:1.7; color:#333; }

/* STATS */
.stats-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.stat-box { background:#F7F5F0; border-radius:12px; padding:14px; }
.stat-n { font-size:22px; font-weight:700; }
.stat-l { font-size:11px; color:#888; margin-top:3px; }

/* MAP BUTTONS */
.map-btns {
  position:fixed; right:12px; bottom:80px; z-index:800;
  display:flex; flex-direction:column; gap:8px;
}
.map-btn {
  background:#fff; border:1px solid #E2E0D8; border-radius:10px;
  padding:10px 14px; font-size:12px; font-weight:500;
  color:#555; cursor:pointer; white-space:nowrap;
  min-height:44px; display:flex; align-items:center; gap:6px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
.map-btn.on { background:#185FA5; color:#fff; border-color:#185FA5; }

/* ALERTS STRIP */
.alerts-strip {
  background:#FFFBEB; border:1px solid #FAC775;
  border-radius:10px; padding:10px 12px; margin-top:10px;
}
.alerts-title { font-size:10px; font-weight:700; color:#BA7517; text-transform:uppercase; margin-bottom:6px; }
.alert-item-small { font-size:12px; color:#633806; margin-bottom:3px; line-height:1.4; }
</style>
</head>
<body>

<div id="map"></div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="logo">Odd<em>-</em>One<span style="color:#aaa;font-weight:400;font-size:11px;">.in</span></div>
  <div class="search-wrap">
    <input type="text" id="s-input" placeholder="Search any city or place..." autocomplete="off" autocorrect="off" spellcheck="false"/>
    <span class="search-icon">🔍</span>
    <div class="sugg" id="sugg"></div>
  </div>
</div>

<!-- MAP BUTTONS -->
<div class="map-btns">
  <button class="map-btn on" id="btn-map" onclick="setTile('map')">🗺️ Map</button>
  <button class="map-btn" id="btn-sat" onclick="setTile('sat')">🛰️ Satellite</button>
  <button class="map-btn" id="btn-loc" onclick="locateMe()">📍 Mine</button>
</div>

<!-- BOTTOM SHEET -->
<div class="bottom-sheet" id="sheet">
  <div class="sheet-handle" id="handle" onclick="toggleSheet()"></div>

  <div class="sheet-tabs">
    <div class="sheet-tab on" id="t-alerts" onclick="showTab('alerts')">🔔 Alerts</div>
    <div class="sheet-tab" id="t-route" onclick="showTab('route')">🗺️ Route</div>
    <div class="sheet-tab" id="t-data" onclick="showTab('data')">📊 Data</div>
  </div>

  <div class="sheet-content">

    <!-- ALERTS -->
    <div class="tab-pane on" id="p-alerts">
      <div id="alerts-box" style="text-align:center;color:#aaa;padding:24px 0;font-size:14px;">
        📡 Loading live alerts...
      </div>
    </div>

    <!-- ROUTE -->
    <div class="tab-pane" id="p-route">
      <div class="field">
        <label>From</label>
        <input type="text" id="r-from" placeholder="Origin city or place"/>
      </div>
      <div class="field">
        <label>To</label>
        <input type="text" id="r-to" placeholder="Destination city or place"/>
      </div>
      <button class="go-btn" id="go-btn" onclick="planRoute()">Get Route →</button>
      <div id="route-out"></div>
    </div>

    <!-- DATA -->
    <div class="tab-pane" id="p-data">
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-n" style="color:#E24B4A">4,628</div><div class="stat-l">Missing roads — Dehradun</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#185FA5">260</div><div class="stat-l">Mapped roads — Dehradun</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#D97706">94.7%</div><div class="stat-l">Data gap</div></div>
        <div class="stat-box"><div class="stat-n" style="color:#166534">5</div><div class="stat-l">Cities tracked</div></div>
      </div>
      <div style="background:#F7F5F0;border-radius:12px;padding:14px;font-size:12px;color:#666;line-height:1.6;margin-top:12px;">
        🔍 In Dehradun, 94.7% of roads are missing from standard map databases — causing navigation failures and safety risks.
      </div>
    </div>

  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CITIES = {
  'dehradun':[30.3165,78.0322],'haridwar':[29.9457,78.1642],'rishikesh':[30.0869,78.2676],
  'nainital':[29.3919,79.4542],'mussoorie':[30.4598,78.0644],'roorkee':[29.8543,77.8880],
  'delhi':[28.6139,77.2090],'mumbai':[19.0760,72.8777],'lucknow':[26.8467,80.9462],
  'varanasi':[25.3176,82.9739],'agra':[27.1767,78.0081],'jaipur':[26.9124,75.7873],
  'kanpur':[26.4499,80.3319],'prayagraj':[25.4358,81.8463],'meerut':[28.9845,77.7064],
  'mathura':[27.4924,77.6737],'auraiya':[26.4651,79.5135],'gorakhpur':[26.7606,83.3732],
  'patna':[25.5941,85.1376],'chandigarh':[30.7333,76.7794],'shimla':[31.1048,77.1734],
  'amritsar':[31.6340,74.8723],'bhopal':[23.2599,77.4126],'indore':[22.7196,75.8577],
  'nagpur':[21.1458,79.0882],'pune':[18.5204,73.8567],'hyderabad':[17.3850,78.4867],
  'bengaluru':[12.9716,77.5946],'bangalore':[12.9716,77.5946],'chennai':[13.0827,80.2707],
  'kolkata':[22.5726,88.3639],'ahmedabad':[23.0225,72.5714],'surat':[21.1702,72.8311],
  'kochi':[9.9312,76.2673],'visakhapatnam':[17.6868,83.2185],
};

// MAPTILER KEY — replace with your key
const MAPTILER_KEY = '6pBBkKOL0SJZhySKd057';

let map, tile, routeLines=[], markers=[], locMarker=null;
let sheetOpen = false;

// INIT MAP
map = L.map('map', { zoomControl:false, attributionControl:false }).setView([22,78], 5);
L.control.zoom({ position:'bottomleft' }).addTo(map);

tile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19
}).addTo(map);

setTimeout(()=>{ map.invalidateSize(); }, 200);

// TILE SWITCH
function setTile(t){
  map.removeLayer(tile);
  if(t==='sat'){
    tile = L.tileLayer(`https://api.maptiler.com/maps/satellite/{z}/{x}/{y}.jpg?key=${MAPTILER_KEY}`,
      {maxZoom:20}).addTo(map);
    document.getElementById('btn-sat').classList.add('on');
    document.getElementById('btn-map').classList.remove('on');
  } else {
    tile = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom:19}).addTo(map);
    document.getElementById('btn-map').classList.add('on');
    document.getElementById('btn-sat').classList.remove('on');
  }
}

// SEARCH
const si = document.getElementById('s-input');
const sg = document.getElementById('sugg');
let timer = null;

si.addEventListener('input', function(){
  const q = this.value.trim();
  if(q.length < 2){ sg.style.display='none'; return; }

  const local = Object.keys(CITIES).filter(c=>c.includes(q.toLowerCase())).slice(0,3);
  if(local.length){
    sg.innerHTML = local.map(c=>`<div class="sugg-item" onclick="gotoCity('${c}')">📍 ${c.charAt(0).toUpperCase()+c.slice(1)}</div>`).join('');
    sg.style.display='block';
  }

  clearTimeout(timer);
  timer = setTimeout(async()=>{
    try {
      const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q+' India')}&format=json&limit=4&countrycodes=in`;
      const res = await fetch(url, {headers:{'Accept-Language':'en','User-Agent':'OddOne/1.0'}});
      const data = await res.json();
      if(!data.length) return;
      const localHTML = local.map(c=>`<div class="sugg-item" onclick="gotoCity('${c}')">📍 ${c.charAt(0).toUpperCase()+c.slice(1)}</div>`).join('');
      const nomHTML = data.map(r=>`<div class="sugg-item" onclick="gotoCoords(${r.lat},${r.lon},'${r.display_name.split(',')[0].replace(/'/g,"\\'")}')">🔍 ${r.display_name.split(',').slice(0,2).join(', ')}</div>`).join('');
      sg.innerHTML = localHTML + nomHTML;
      sg.style.display='block';
    } catch(e){}
  }, 500);
});

si.addEventListener('keydown', e=>{
  if(e.key==='Enter'){
    sg.style.display='none';
    si.blur();
    const q = si.value.toLowerCase().trim();
    const m = Object.keys(CITIES).find(c=>c.includes(q));
    if(m) gotoCity(m);
  }
});

document.addEventListener('click', e=>{ if(!si.contains(e.target)) sg.style.display='none'; });

function gotoCity(city){
  const c = CITIES[city]; if(!c) return;
  map.flyTo(c, 13, {duration:1.2});
  sg.style.display='none';
  si.value = city.charAt(0).toUpperCase()+city.slice(1);
  si.blur();
  placeMarker(c, city);
  loadAlerts(city);
  openSheet();
}

function gotoCoords(lat, lon, name){
  const c = [parseFloat(lat), parseFloat(lon)];
  map.flyTo(c, 14, {duration:1.2});
  sg.style.display='none';
  si.value = name;
  si.blur();
  placeMarker(c, name);
  loadAlerts(name);
  openSheet();
}

function placeMarker(coords, name){
  if(locMarker) map.removeLayer(locMarker);
  locMarker = L.marker(coords, {icon:L.divIcon({
    html:'<div style="background:#185FA5;width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.3)"></div>',
    className:'',iconSize:[14,14],iconAnchor:[7,7]
  })}).addTo(map).bindPopup(`<b>${name}</b>`).openPopup();
}

// ROUTE
async function planRoute(){
  const from = document.getElementById('r-from').value.trim().toLowerCase();
  const to = document.getElementById('r-to').value.trim().toLowerCase();
  if(!from||!to) return;

  const fc = CITIES[from] || findClosest(from);
  const tc = CITIES[to] || findClosest(to);

  if(!fc||!tc){
    document.getElementById('route-out').innerHTML='<div style="color:#E24B4A;font-size:13px;margin-top:10px;padding:12px;background:#FFF0F0;border-radius:10px;">City not found. Try: Dehradun, Delhi, Mumbai...</div>';
    return;
  }

  const btn = document.getElementById('go-btn');
  btn.disabled=true; btn.textContent='Planning...';
  routeLines.forEach(l=>map.removeLayer(l)); routeLines=[];
  markers.forEach(m=>map.removeLayer(m)); markers=[];

  // Place markers
  const mk=(c,col)=>L.marker(c,{icon:L.divIcon({
    html:`<div style="background:${col};width:14px;height:14px;border-radius:50%;border:2.5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)"></div>`,
    className:'',iconSize:[14,14],iconAnchor:[7,7]
  })}).addTo(map);
  markers.push(mk(fc,'#185FA5'));
  markers.push(mk(tc,'#E24B4A'));

  let dist, time;
  try {
    const osrm = await fetch(`https://router.project-osrm.org/route/v1/driving/${fc[1]},${fc[0]};${tc[1]},${tc[0]}?overview=full&geometries=geojson`);
    const od = await osrm.json();
    if(od.code==='Ok'){
      const route = od.routes[0];
      dist = Math.round(route.distance/1000);
      time = Math.round(route.duration/60);
      const coords = route.geometry.coordinates.map(c=>[c[1],c[0]]);
      const rl = L.polyline(coords,{color:'#FF8C00',weight:4,opacity:.9}).addTo(map);
      routeLines.push(rl);
      map.fitBounds(rl.getBounds(),{padding:[60,80]});
    } else throw new Error();
  } catch(e){
    dist = calcDist(fc,tc);
    time = Math.round(dist*1.4);
    const rl = L.polyline([fc,tc],{color:'#FF8C00',weight:4,opacity:.9,dashArray:'10,7'}).addTo(map);
    routeLines.push(rl);
    map.fitBounds(L.latLngBounds([fc,tc]),{padding:[60,80]});
  }

  const missing = Math.round(dist*400+5000);
  const pct = Math.round((missing/(missing+dist*15+100))*100);
  const alerts = await fetchAlerts(from);

  btn.disabled=false; btn.textContent='Get Route →';

  document.getElementById('route-out').innerHTML=`
    <div class="route-stats">
      <div class="route-stat"><div class="route-stat-n">${dist} km</div><div class="route-stat-l">Distance</div></div>
      <div class="route-stat"><div class="route-stat-n">${time} min</div><div class="route-stat-l">Est. time</div></div>
      <div class="route-stat"><div class="route-stat-n" style="color:#E24B4A">${pct}%</div><div class="route-stat-l">Roads missing</div></div>
    </div>
    ${alerts.length?`<div class="alerts-strip"><div class="alerts-title">⚠️ Live Alerts</div>${alerts.slice(0,3).map(a=>`<div class="alert-item-small">• ${a}</div>`).join('')}</div>`:''}
    <div class="ai-box">
      <div class="ai-label">🤖 AI Navigation Guide</div>
      <div class="ai-text">Route from ${from} to ${to}: ${dist}km, approx ${time} minutes. ${pct}% of roads on this route have missing map data — drive carefully in unfamiliar areas. Start early morning to avoid traffic. Safe travels! 🙏</div>
    </div>
  `;
}

function findClosest(q){
  return CITIES[Object.keys(CITIES).find(k=>k.startsWith(q.slice(0,4)))||''] || null;
}

function calcDist(c1,c2){
  const R=6371, dLat=(c2[0]-c1[0])*Math.PI/180, dLon=(c2[1]-c1[1])*Math.PI/180;
  const a=Math.sin(dLat/2)**2+Math.cos(c1[0]*Math.PI/180)*Math.cos(c2[0]*Math.PI/180)*Math.sin(dLon/2)**2;
  return Math.round(R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)));
}

// ALERTS
async function fetchAlerts(city){
  try {
    const url = `https://news.google.com/rss/search?q=${encodeURIComponent(city+' road blocked traffic')}&hl=en-IN&gl=IN&ceid=IN:en`;
    const r = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`);
    const xml = new DOMParser().parseFromString(await r.text(),'text/xml');
    return [...xml.querySelectorAll('item')].slice(0,4).map(i=>(i.querySelector('title')?.textContent||'').split(' - ')[0].substring(0,75));
  } catch(e){ return []; }
}

async function loadAlerts(city){
  document.getElementById('alerts-box').innerHTML='<div style="text-align:center;color:#aaa;padding:20px;font-size:13px;">📡 Loading...</div>';
  const alerts = await fetchAlerts(city);
  if(!alerts.length){
    document.getElementById('alerts-box').innerHTML='<div style="text-align:center;color:#aaa;padding:20px;font-size:13px;">✅ No major alerts</div>';
    return;
  }
  const cols=['','medium','low','medium',''];
  document.getElementById('alerts-box').innerHTML = alerts.map((a,i)=>`
    <div class="alert-card ${cols[i%3]}">
      <div class="alert-title">${a}</div>
      <div class="alert-meta">${i%3===0?'🔴 High':i%3===1?'🟡 Moderate':'🔵 Info'} • Just now</div>
    </div>
  `).join('');
  showTab('alerts');
}

// LOCATE
function locateMe(){
  if(!navigator.geolocation) return;
  document.getElementById('btn-loc').textContent='...';
  navigator.geolocation.getCurrentPosition(pos=>{
    const c=[pos.coords.latitude,pos.coords.longitude];
    map.flyTo(c,15);
    if(locMarker) map.removeLayer(locMarker);
    locMarker = L.marker(c,{icon:L.divIcon({
      html:'<div style="background:#185FA5;width:16px;height:16px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(24,95,165,.5)"></div>',
      className:'',iconSize:[16,16],iconAnchor:[8,8]
    })}).addTo(map).bindPopup('You are here').openPopup();
    document.getElementById('btn-loc').textContent='📍 Mine';
  },()=>{ document.getElementById('btn-loc').textContent='📍 Mine'; });
}

// SHEET
function toggleSheet(){
  const sheet = document.getElementById('sheet');
  sheetOpen = !sheetOpen;
  sheet.classList.toggle('open', sheetOpen);
}
function openSheet(){
  sheetOpen = true;
  document.getElementById('sheet').classList.add('open');
}

// TABS
function showTab(t){
  ['alerts','route','data'].forEach(x=>{
    document.getElementById('t-'+x).classList.toggle('on',x===t);
    document.getElementById('p-'+x).classList.toggle('on',x===t);
  });
}

// INIT
loadAlerts('dehradun');
</script>
</body>
</html>
