<!DOCTYPE html>
<html lang="en" style="height: 100%; margin: 0;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- Tailwind CSS v4 Browser CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  
  <!-- Premium Google Fonts (Serif + Sans Pairing) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    /* Global Font Settings */
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      margin: 0;
      height: 100%;
      background-color: #050505;
      color: #d4d4d8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .font-serif-lux {
      font-family: 'Playfair Display', Georgia, serif;
    }

    .font-mono-lux {
      font-family: 'JetBrains Mono', monospace;
    }

    /* ── LEAFLET DARK MAP FILTER ── */
    #map {
      background-color: #050505;
    }
    .leaflet-tile-pane {
      /* filter applied via JS for map mode only */
    }
    .dark-map-filter {
      filter: invert(1) hue-rotate(180deg) brightness(1.05) saturate(0.65) !important;
    }
    .leaflet-control-attribution {
      display: none !important;
    }

    /* ── CUSTOM SCROLLBARS ── */
    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #27272a;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f46;
    }

    /* ── LEAFLET POPUP & CONTROL CUSTOMIZATION ── */
    .leaflet-popup-content-wrapper {
      background: #0a0a0a !important;
      color: #e4e4e7 !important;
      border: 1px solid #27272a !important;
      border-radius: 12px !important;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8) !important;
    }
    .leaflet-popup-tip {
      background: #0a0a0a !important;
      border: 1px solid #27272a !important;
    }
    .leaflet-popup-content {
      font-family: 'Plus Jakarta Sans', sans-serif !important;
      font-size: 13px !important;
      padding: 6px 4px !important;
    }
    .leaflet-control-zoom {
      border: 1px solid #27272a !important;
      box-shadow: none !important;
    }
    .leaflet-control-zoom a {
      background: #0a0a0a !important;
      color: #a1a1aa !important;
      border-bottom: 1px solid #1f1f23 !important;
      transition: all 0.2s;
    }
    .leaflet-control-zoom a:hover {
      background: #18181b !important;
      color: #ffffff !important;
    }

    /* ── BOTTOM SHEET TRANSITION FOR MOBILE ── */
    .bottom-sheet {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .bottom-sheet.open {
      transform: translateY(0);
    }

    /* ── SUGGESTIONS HOVER ── */
    .sugg-item:hover {
      background: #18181b;
    }

    /* ── TAB TRANSITION ── */
    .tab-pane {
      display: none;
    }
    .tab-pane.on {
      display: flex;
      flex-direction: column;
    }
  </style>
</head>

  <!-- ── MAIN CONTENT (MAP + SIDEBAR) ── -->

    <!-- ── DESKTOP SIDEBAR (RIGHT) ── -->

        <!-- Data/Stats Pane -->

      <!-- Collapsible Sidebar Handle -->

    <!-- ── MOBILE BOTTOM SHEET (SHOWN ONLY ON SMALL SCREENS) ── -->

      <div class="flex border-b border-zinc-900 shrink-0">
        <button id="mt-alerts" class="flex-1 py-3 text-center text-[10px] uppercase tracking-wider font-bold text-zinc-500 border-b-2 border-transparent hover:text-white on" onclick="showTab('alerts')">

        <button id="mt-route" class="flex-1 py-3 text-center text-[10px] uppercase tracking-wider font-bold text-zinc-500 border-b-2 border-transparent hover:text-white" onclick="showTab('route')">

        </button>
        <button id="mt-data" class="flex-1 py-3 text-center text-[10px] uppercase tracking-wider font-bold text-zinc-500 border-b-2 border-transparent hover:text-white" onclick="showTab('data')">

        </button>
      </div>

      <!-- Tab Content Area -->
      <div class="flex-1 overflow-y-auto p-4 space-y-4">
        <!-- Alerts Tab -->
        <div id="mp-alerts" class="tab-pane on space-y-3">
          <div id="m-alerts-box" class="space-y-3"></div>
        </div>

        <!-- Route Tab -->
        <div id="mp-route" class="tab-pane space-y-4">
          <div class="space-y-3">

              <label class="text-[9px] uppercase tracking-widest text-zinc-500 font-bold">Origin City</label>

    <!-- ── MAP LAYERS FLOATING CONTROLS (BOTTOM RIGHT) ── -->
    <div class="absolute bottom-16 sm:bottom-6 right-4 z-40 flex flex-col gap-2">
      <button id="btn-map" class="bg-black/80 hover:bg-zinc-900 text-zinc-300 hover:text-white border border-zinc-800 text-[10px] font-semibold tracking-wider uppercase px-4 py-2.5 rounded-full shadow-2xl transition-all cursor-pointer on flex items-center gap-1.5" onclick="setTile('map')">
        <span class="w-1.5 h-1.5 rounded-full bg-white"></span> Map
      </button>
      <button id="btn-sat" class="bg-black/80 hover:bg-zinc-900 text-zinc-300 hover:text-white border border-zinc-800 text-[10px] font-semibold tracking-wider uppercase px-4 py-2.5 rounded-full shadow-2xl transition-all cursor-pointer flex items-center gap-1.5" onclick="setTile('sat')">
        <span class="w-1.5 h-1.5 rounded-full bg-zinc-600"></span> Satellite
      </button>
      <button id="btn-loc" class="bg-black/80 hover:bg-zinc-900 text-zinc-300 hover:text-white border border-zinc-800 text-[10px] font-semibold tracking-wider uppercase px-4 py-2.5 rounded-full shadow-2xl transition-all cursor-pointer flex items-center gap-1.5" onclick="locateMe()">
        ◎ Locate Me
      </button>

  </main>

  <!-- ── CORE RUNTIME FOOTER ── -->
  <footer class="h-10 bg-black border-t border-zinc-900 px-4 sm:px-8 flex items-center justify-between text-[9px] text-zinc-600 shrink-0 z-50">
    <div class="flex gap-4">
      <span>Leaflet 1.9 Engine</span>
      <span>Nominatim Geocoder</span>
      <span>OSRM High-Speed Router</span>
      <span class="hidden sm:inline">Gemini AI Intelligence</span>
    </div>
    <div>© 2026 ODD-ONE.IN • PRODUCTION REDESIGN</div>

  <!-- Leaflet Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    // ── CITIES INTEL DATA ──
    const CITIES = {
      'dehradun':[30.3165,78.0322],'haridwar':[29.9457,78.1642],'rishikesh':[30.0869,78.2676],
      'nainital':[29.3919,79.4542],'mussoorie':[30.4598,78.0644],'roorkee':[29.8543,77.8880],
      'delhi':[28.6139,77.2090],'new delhi':[28.6139,77.2090],'mumbai':[19.0760,72.8777],
      'lucknow':[26.8467,80.9462],'varanasi':[25.3176,82.9739],'agra':[27.1767,78.0081],
      'jaipur':[26.9124,75.7873],'kanpur':[26.4499,80.3319],'prayagraj':[25.4358,81.8463],
      'allahabad':[25.4358,81.8463],'meerut':[28.9845,77.7064],'mathura':[27.4924,77.6737],
      'aligarh':[27.8974,78.0880],'bareilly':[28.3670,79.4304],'moradabad':[28.8386,78.7733],
      'auraiya':[26.4651,79.5135],'gorakhpur':[26.7606,83.3732],'patna':[25.5941,85.1376],
      'chandigarh':[30.7333,76.7794],'shimla':[31.1048,77.1734],'amritsar':[31.6340,74.8723],
      'ludhiana':[30.9009,75.8573],'bhopal':[23.2599,77.4126],'indore':[22.7196,75.8577],
      'nagpur':[21.1458,79.0882],'pune':[18.5204,73.8567],'hyderabad':[17.3850,78.4867],
      'bengaluru':[12.9716,77.5946],'bangalore':[12.9716,77.5946],'chennai':[13.0827,80.2707],
      'kolkata':[22.5726,88.3639],'ahmedabad':[23.0225,72.5714],'surat':[21.1702,72.8311],
      'kochi':[9.9312,76.2673],'visakhapatnam':[17.6868,83.2185],
      'thiruvananthapuram':[8.5241,76.9366],'coimbatore':[11.0168,76.9558],
      'muzaffarnagar':[29.4727,77.7085],'saharanpur':[29.9680,77.5552],
    };

    // ── STATS AND INTEL HTML TEMPLATE ──
    const STATS_HTML = `
      <div class="grid grid-cols-2 gap-3">
        <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-xl p-4">
          <p class="text-xs font-serif-lux italic text-rose-500 font-bold text-lg leading-none">4,628</p>
          <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1.5 leading-tight">Missing Roads<br>Dehradun</p>
        </div>
        <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-xl p-4">
          <p class="text-xs font-serif-lux italic text-sky-400 font-bold text-lg leading-none">260</p>
          <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1.5 leading-tight">Mapped Roads<br>Dehradun</p>
        </div>
        <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-xl p-4">
          <p class="text-xs font-serif-lux italic text-amber-500 font-bold text-lg leading-none">94.7%</p>
          <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1.5 leading-tight">Data Gap<br>Uttarakhand</p>
        </div>
        <div class="bg-zinc-900/50 border border-zinc-800/80 rounded-xl p-4">
          <p class="text-xs font-serif-lux italic text-emerald-400 font-bold text-lg leading-none">5</p>
          <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1.5 leading-tight">Cities<br>Tracked</p>
        </div>
      </div>
      <div class="bg-zinc-900/40 border border-zinc-800/60 rounded-xl p-4 text-xs text-zinc-400 leading-relaxed font-serif-lux italic">
        🔍 Research: In Dehradun, 94.7% of roads are missing from standard map databases — causing navigation failures, logistics delays, and blocking autonomous vehicle deployment in India.
      </div>`;
    document.getElementById('stats-content').innerHTML = STATS_HTML;
    document.getElementById('m-stats-content').innerHTML = STATS_HTML;

    // ── GLOBAL MAP CONFIGS & HOOKS ──
    let map, tile, routeLines = [], markers = [], locMarker = null;
    let sidebarOpen = true, sheetOpen = false;
    const isMobile = () => window.innerWidth <= 640;

    // Initialize Map Instance
    map = L.map('map', { zoomControl: false, attributionControl: false }).setView([22, 78], 5);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    // Initial tile layer setup
    tile = L.tileLayer('/api/tiles?z={z}&x={x}&y={y}', { maxZoom: 19, subdomains: [''] }).addTo(map);

    setTimeout(() => map.invalidateSize(), 300);

    // Manual Point Select Popup
    map.on('click', e => {
      const lat = e.latlng.lat.toFixed(5), lng = e.latlng.lng.toFixed(5);
      L.popup().setLatLng(e.latlng)
        .setContent(`<div class="space-y-1">
          <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold">Selected Coordinate</p>
          <p class="text-xs font-mono-lux text-white">${lat}, ${lng}</p>
        </div>`)
        .openOn(map);
    });

    // ── MAP TILE LAYER SELECTION ──
    function setTile(t) {
      map.removeLayer(tile);
      if (t === 'sat') {
        tile = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 }).addTo(map);
        setTimeout(()=>{ const tp=document.querySelector('.leaflet-tile-pane'); if(tp) tp.classList.remove('dark-map-filter'); }, 50);
        document.getElementById('btn-sat').classList.add('on');
        document.getElementById('btn-sat').querySelector('span').classList.replace('bg-zinc-600', 'bg-white');
        document.getElementById('btn-map').classList.remove('on');
        document.getElementById('btn-map').querySelector('span').classList.replace('bg-white', 'bg-zinc-600');
      } else {
        tile = L.tileLayer('/api/tiles?z={z}&x={x}&y={y}', { maxZoom: 19, subdomains: [''] }).addTo(map);

        document.getElementById('btn-map').classList.add('on');
        document.getElementById('btn-map').querySelector('span').classList.replace('bg-zinc-600', 'bg-white');
        document.getElementById('btn-sat').classList.remove('on');
        document.getElementById('btn-sat').querySelector('span').classList.replace('bg-white', 'bg-zinc-600');
      }
    }

    // ── SEARCH LOGIC & NOMINATIM INTEGRATION ──
    const si = document.getElementById('s-input');
    const sg = document.getElementById('sugg');
    let searchTimer = null;

    si.addEventListener('input', function() {
      const q = this.value.trim();
      if (q.length < 2) { sg.style.display = 'none'; return; }
      
      // Filter local CITIES database
      const local = Object.keys(CITIES).filter(c => c.includes(q.toLowerCase())).slice(0, 3);
      const localHTML = local.map(c => `
        <div class="sugg-item flex items-center gap-2.5 px-4 py-2.5 text-xs text-zinc-300 border-b border-zinc-900 cursor-pointer transition-colors" onclick="gotoCity('${c}')">
          <span class="text-rose-500">📍</span>
          <span>${c.charAt(0).toUpperCase() + c.slice(1)}</span>
          <span class="text-[9px] uppercase tracking-wider text-zinc-600 ml-auto font-bold">Local Intel</span>
        </div>`).join('');
      
      if (local.length) {
        sg.innerHTML = localHTML;
        sg.style.display = 'block';
      }

      // Nominatim search query
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        try {
          const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(q + ' India')}&format=json&limit=4&countrycodes=in`;
          const res = await fetch(url, { headers: { 'Accept-Language': 'en', 'User-Agent': 'OddOneIn/1.0' } });
          const data = await res.json();
          if (!data.length) return;
          
          const nomHTML = data.map(r => {
            const safeName = r.display_name.split(',')[0].replace(/'/g, "\\'");
            return `
              <div class="sugg-item flex items-center gap-2.5 px-4 py-2.5 text-xs text-zinc-400 border-b border-zinc-900 cursor-pointer transition-colors" onclick="gotoCoords(${r.lat},${r.lon},'${safeName}')">
                <span class="text-zinc-500">🔍</span>
                <span class="truncate">${r.display_name.split(',').slice(0, 2).join(', ')}</span>
                <span class="text-[9px] uppercase tracking-wider text-zinc-600 ml-auto font-bold">OSM</span>
              </div>`;
          }).join('');
          
          sg.innerHTML = localHTML + nomHTML;
          sg.style.display = 'block';
        } catch (e) {}
      }, 500);
    });

    si.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        sg.style.display = 'none';
        si.blur();
        const q = si.value.toLowerCase().trim();
        const m = Object.keys(CITIES).find(c => c.includes(q));
        if (m) gotoCity(m);
      }
    });

    document.addEventListener('click', e => {
      if (!si.contains(e.target)) sg.style.display = 'none';
    });

    // ── PANNING & MARKERS ──
    function gotoCity(city) {
      const c = CITIES[city]; if (!c) return;
      map.flyTo(c, 13, { duration: 1.2 });
      sg.style.display = 'none';
      si.value = city.charAt(0).toUpperCase() + city.slice(1); si.blur();
      placeMarker(c, si.value);
      loadAlerts(city);
      if (isMobile()) { openSheetMid(); showTab('alerts'); } else showTab('alerts');
    }

    function gotoCoords(lat, lon, name) {
      const c = [parseFloat(lat), parseFloat(lon)];
      map.flyTo(c, 14, { duration: 1.2 });
      sg.style.display = 'none'; si.value = name; si.blur();
      placeMarker(c, name);
      loadAlerts(name);
      if (isMobile()) { openSheetMid(); showTab('alerts'); } else showTab('alerts');
    }

    function placeMarker(coords, name) {
      if (locMarker) map.removeLayer(locMarker);
      locMarker = L.marker(coords, {
        icon: L.divIcon({
          html: `<div style="width:12px;height:12px;background:#ffffff;border-radius:50%;border:2.5px solid #ef4444;box-shadow:0 0 0 4px rgba(239,68,68,0.25)"></div>`,
          className: '', iconSize: [12, 12], iconAnchor: [6, 6]
        })
      }).addTo(map).bindPopup(`<b class="text-white">${name}</b>`).openPopup();
    }

    // ── HIGH SPEED ROUTER ENGINE (OSRM) ──
    async function planRoute(p) {
      const from = document.getElementById(p + '-from').value.trim().toLowerCase();
      const to = document.getElementById(p + '-to').value.trim().toLowerCase();
      if (!from || !to) return;
      
      const fc = CITIES[from] || findClosest(from);
      const tc = CITIES[to] || findClosest(to);
      if (!fc || !tc) {
        document.getElementById(p + '-route-out').innerHTML = `
          <div class="text-rose-500 text-xs mt-3 p-3 bg-rose-500/10 border border-rose-500/20 rounded-xl">
            Location not recognized. Try typing: Dehradun, Delhi, Mumbai, Lucknow...
          </div>`;
        return;
      }
      
      const btn = document.getElementById(p + '-go-btn');
      btn.disabled = true; btn.textContent = 'Calculating Route...';
      
      routeLines.forEach(l => map.removeLayer(l)); routeLines = [];
      markers.forEach(m => map.removeLayer(m)); markers = [];

      // Start/End Marker divs
      const mk = (c, borderCol) => L.marker(c, {
        icon: L.divIcon({
          html: `<div style="width:12px;height:12px;background:#ffffff;border-radius:50%;border:2.5px solid ${borderCol};box-shadow:0 4px 10px rgba(0,0,0,0.5)"></div>`,
          className: '', iconSize: [12, 12], iconAnchor: [6, 6]
        })
      }).addTo(map);
      
      markers.push(mk(fc, '#3b82f6'), mk(tc, '#ef4444'));

      let dist, time;
      try {
        const osrm = await fetch(`https://router.project-osrm.org/route/v1/driving/${fc[1]},${fc[0]};${tc[1]},${tc[0]}?overview=full&geometries=geojson`);
        const od = await osrm.json();
        if (od.code === 'Ok') {
          const route = od.routes[0];
          dist = Math.round(route.distance / 1000);
          time = Math.round(route.duration / 60);
          const coords = route.geometry.coordinates.map(c => [c[1], c[0]]);
          const rl = L.polyline(coords, { color: '#ffffff', weight: 3, opacity: 0.95 }).addTo(map);
          routeLines.push(rl);
          map.fitBounds(rl.getBounds(), { padding: [60, 80] });
        } else throw new Error();
      } catch (e) {
        dist = calcDist(fc, tc); time = Math.round(dist * 1.4);
        const rl = L.polyline([fc, tc], { color: '#ffffff', weight: 3, opacity: 0.8, dashArray: '8,6' }).addTo(map);
        routeLines.push(rl);
        map.fitBounds(L.latLngBounds([fc, tc]), { padding: [60, 80] });
      }

      const missing = Math.round(dist * 400 + 5000);
      const pct = Math.min(98, Math.round((missing / (missing + dist * 15 + 100)) * 100));
      
      // Update floating desktop stat overlay
      document.getElementById('stat-dist-val').innerText = `${dist} km`;
      document.getElementById('stat-time-val').innerText = `${time} mins`;
      document.getElementById('stat-gap-val').innerText = `${pct}%`;

      const alerts = await fetchAlerts(from);
      const aiGuide = await getAIGuide(from, to, dist, time, alerts, pct);
      btn.disabled = false; btn.textContent = 'Calculate Route →';

      const html = `
        <!-- Floating-like Stat Boxes in Sidebar -->
        <div class="grid grid-cols-3 gap-2 mt-4">
          <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-3 text-center">
            <p class="text-white text-base font-bold">${dist}<span class="text-[10px] text-zinc-500 font-normal"> km</span></p>
            <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1">Distance</p>
          </div>
          <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-3 text-center">
            <p class="text-white text-base font-bold">${time}<span class="text-[10px] text-zinc-500 font-normal"> min</span></p>
            <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1">Duration</p>
          </div>
          <div class="bg-zinc-900/60 border border-zinc-800 rounded-xl p-3 text-center">
            <p class="text-rose-500 text-base font-bold">${pct}<span class="text-[10px] font-normal">%</span></p>
            <p class="text-[9px] uppercase tracking-wider text-zinc-500 font-bold mt-1">Data Gap</p>
          </div>
        </div>

        ${alerts.length ? `
        <div class="bg-rose-500/10 border border-rose-500/25 rounded-xl p-4 space-y-2 mt-3">
          <p class="text-[10px] uppercase tracking-wider text-rose-500 font-bold">⚠ Live Local Alerts</p>
          <div class="space-y-1.5">
            ${alerts.slice(0, 3).map(a => `<p class="text-xs text-zinc-300 leading-snug">• ${a}</p>`).join('')}
          </div>
        </div>` : ''}

        <!-- AI Navigation Intelligence -->
        <div class="bg-gradient-to-br from-zinc-900/80 to-zinc-950 border border-zinc-800 rounded-xl p-4 shadow-xl space-y-2.5 mt-3">
          <p class="text-[10px] uppercase tracking-wider text-white font-bold flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
            AI Route Intelligence
          </p>
          <p class="text-xs text-zinc-300 font-serif-lux italic leading-relaxed">${aiGuide}</p>
        </div>`;
        
      document.getElementById(p + '-route-out').innerHTML = html;
    }

    function findClosest(q) {
      return CITIES[Object.keys(CITIES).find(k => k.startsWith(q.slice(0, 4))) || ''] || null;
    }
    
    function calcDist(c1, c2) {
      const R = 6371, dLat = (c2[0] - c1[0]) * Math.PI / 180, dLon = (c2[1] - c1[1]) * Math.PI / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(c1[0] * Math.PI / 180) * Math.cos(c2[0] * Math.PI / 180) * Math.sin(dLon / 2) ** 2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a)));
    }

    // ── AI NAVIGATION CO-PILOT ──
    async function getAIGuide(origin, dest, dist, time, alerts, missingPct) {
      try {
        const res = await fetch('/api/route-guide', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ origin, dest, dist, time, alerts, missingPct, lang: 'en' })
        });
        if (!res.ok) return defaultGuide(origin, dest);
        const data = await res.json();
        return data.text || defaultGuide(origin, dest);
      } catch (e) {
        return defaultGuide(origin, dest);
      }
    }
    
    function defaultGuide(o, d) {
      return `${o.toUpperCase()} to ${d.toUpperCase()} — start early morning to avoid traffic choke points. Keep drinking water handy and verify local weather updates. Safe journey!`;
    }

    // ── LIVE ALERT EXTRACTION ──
    async function fetchAlerts(city) {
      try {
        const r = await fetch(`/api/news?city=${encodeURIComponent(city)}`);
        if (!r.ok) return [];
        const data = await r.json();
        return data.alerts || [];
      } catch (e) {
        return [];
      }
    }

    async function loadAlerts(city) {
      const loading = `
        <div class="flex flex-col items-center justify-center py-12 text-zinc-500 gap-3">
          <div class="w-6 h-6 border-2 border-zinc-700 border-t-zinc-400 rounded-full animate-spin"></div>
          <p class="text-xs uppercase tracking-wider text-zinc-600 font-bold">Scanning for Alerts...</p>
        </div>`;
      document.getElementById('d-alerts-box').innerHTML = loading;
      document.getElementById('m-alerts-box').innerHTML = loading;
      
      const alerts = await fetchAlerts(city);
      if (!alerts.length) {
        const msg = `
          <div class="text-center py-12 text-zinc-500 space-y-1 bg-zinc-900/30 rounded-xl border border-zinc-900 p-5">
            <span class="text-2xl block">✓</span>
            <p class="text-xs uppercase tracking-wider text-zinc-400 font-bold">Safe Corridor</p>
            <p class="text-[11px] text-zinc-600">No major road blocks or alerts active right now</p>
          </div>`;
        document.getElementById('d-alerts-box').innerHTML = msg;
        document.getElementById('m-alerts-box').innerHTML = msg;
        return;
      }
      
      const types = [['HIGH', 'bg-rose-500/10 text-rose-400 border-rose-500/20'], ['MEDIUM', 'bg-amber-500/10 text-amber-400 border-amber-500/20'], ['LOW', 'bg-blue-500/10 text-blue-400 border-blue-500/20']];
      
      const html = alerts.map((a, i) => {
        const typeIndex = i % 3;
        const [badgeLabel, badgeClasses] = types[typeIndex];
        return `
          <div class="bg-zinc-900/40 hover:bg-zinc-900/60 border border-zinc-900 hover:border-zinc-800 rounded-xl p-4 transition-all space-y-2.5">
            <div class="flex items-center justify-between">
              <span class="text-[8px] font-bold tracking-widest uppercase border px-2 py-0.5 rounded-full ${badgeClasses}">${badgeLabel}</span>
              <span class="text-[9px] text-zinc-600 font-semibold font-mono-lux">Just Now</span>
            </div>
            <p class="text-xs text-zinc-200 leading-snug">${a}</p>
          </div>`;
      }).join('');
      
      document.getElementById('d-alerts-box').innerHTML = html;
      document.getElementById('m-alerts-box').innerHTML = html;
      showTab('alerts');
    }

    // ── LOCATE ME SERVICE ──
    function locateMe() {
      if (!navigator.geolocation) return;
      document.getElementById('btn-loc').innerText = 'Locating...';
      navigator.geolocation.getCurrentPosition(pos => {
        const c = [pos.coords.latitude, pos.coords.longitude];
        map.flyTo(c, 15);
        if (locMarker) map.removeLayer(locMarker);
        locMarker = L.marker(c, {
          icon: L.divIcon({
            html: `<div style="width:14px;height:14px;background:#ffffff;border-radius:50%;border:2.5px solid #3b82f6;box-shadow:0 0 0 6px rgba(59,130,246,0.25)"></div>`,
            className: '', iconSize: [14, 14], iconAnchor: [7, 7]
          })
        }).addTo(map).bindPopup('<b class="text-white">Active Location</b>').openPopup();
        document.getElementById('btn-loc').innerText = '◎ Locate Me';
      }, () => {
        document.getElementById('btn-loc').innerText = '◎ Locate Me';
      });
    }

    // ── SIDEBAR CONTROLS ──
    function toggleSidebar() {
      sidebarOpen = !sidebarOpen;
      const sidebar = document.getElementById('sidebar');
      const toggle = document.getElementById('toggle-btn');
      if (sidebarOpen) {
        sidebar.classList.remove('hidden');
        toggle.innerText = '◀';
        toggle.style.left = '-12px';
      } else {
        sidebar.classList.add('hidden');
        toggle.innerText = '▶';
        toggle.style.left = '-24px';
      }
      setTimeout(() => map.invalidateSize(), 320);
    }

    // ── MOBILE BOTTOM SHEET GRAB HANDLE ──
    function toggleSheet() {
      sheetOpen = !sheetOpen;
      document.getElementById('sheet').classList.toggle('open', sheetOpen);
    }
    
    function openSheet() {
      sheetOpen = true;
      document.getElementById('sheet').classList.add('open');
    }
    
    function openSheetMid() {
      sheetOpen = false;
      document.getElementById('sheet').classList.remove('open');
    }

    // ── TAB SWITCH ENGINE ──
    function showTab(t) {
      ['alerts', 'route', 'data'].forEach(x => {
        const on = x === t;
        ['dt', 'mt'].forEach(p => {
          const el = document.getElementById(p + '-' + x);
          if (el) {
            el.classList.toggle('text-white', on);
            el.classList.toggle('text-zinc-500', !on);
            el.classList.toggle('border-white', on);
          }
        });
        ['dp', 'mp'].forEach(p => {
          const el = document.getElementById(p + '-' + x);
          if (el) el.classList.toggle('on', on);
        });
      });
    }

    // Initialize Default States
    loadAlerts('dehradun');
  </script>
</body>
</html>
