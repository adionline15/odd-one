name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check interaction-v2.js
          node --check api/news.js
          node --check api/route-guide.js
          node --check api/tiles.js
          node --check api/observations.js
          node --check api/observation-summary.js
          python3 - <<'PY'
          import re
          import subprocess
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, re.S)
          for i, script in enumerate(scripts, 1):
              if not script.strip():
                  continue
              path = Path(f"/tmp/index-script-{i}.js")
              path.write_text(script, encoding="utf-8")
              subprocess.run(["node", "--check", str(path)], check=True)
          print(f"Validated {len(scripts)} inline script blocks.")
          PY

      - name: Validate required HTML landmarks
        shell: bash
        run: |
          set -euo pipefail
          grep -q '<title>Odd-One.in' index.html
          grep -q 'id="map"' index.html
          grep -q 'id="sidebar"' index.html
          grep -q 'aria-label="Primary navigation"' index.html

      - name: Validate shell scripts
        run: |
          find .github -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n

      - name: Validate JSON
        run: node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('vercel.json OK')"

      - name: Run unit tests
        run: node --test tests/*.test.mjs

      - name: Check database summary contract
        run: grep -q 'approved_observation_summary' db/schema.sql

      - name: Check observation API contract
        run: |
          grep -q "api_version: 'observations-v6'" api/observations.js
          grep -q "api_version: 'observation-summary-v1'" api/observation-summary.js

      - name: Check intelligence API contracts
        run: |
          test -f "api/observations/[id].js"
          test -f api/observation-stats.js
          test -f api/road-change.js
          test -f api/observation-quality.js
          grep -q "observation-detail-v1" "api/observations/[id].js"
          grep -q "observation-stats-v1" api/observation-stats.js
          grep -q "road-change-v1" api/road-change.js
          grep -q "observation-quality-v1" api/observation-quality.js
          grep -q "approved_observation_detail" db/schema.sql
          grep -q "approved_observation_stats" db/schema.sql
          grep -q "approved_road_change_in_view" db/schema.sql

      - name: Check database metadata contract
        run: grep -q "jsonb_typeof(metadata) = 'object'" db/schema.sql

      - name: Check root tile proxy removal
        run: test ! -f tiles.js

      - name: Check observation endpoint
        run: test -f api/observations.js

      - name: Check summary endpoint
        run: test -f api/observation-summary.js

      - name: Check route endpoint
        run: test -f api/route-guide.js

      - name: Check news endpoint
        run: test -f api/news.js

      - name: Check tile endpoint
        run: test -f api/tiles.js

      - name: Check satellite endpoint
        run: test -f api/satellite.js

      - name: Check security documentation
        run: grep -q 'Secret boundary' docs/SECURITY.md

      - name: Check architecture documentation
        run: grep -q 'Viewport-first loading' docs/ARCHITECTURE.md

      - name: Check data trust documentation
        run: grep -q 'Data trust principles' README.md

      - name: Check frontend architecture budgets
        shell: bash
        run: |
          set -euo pipefail
          test `wc -c < index.html` -le 22000
          test `wc -c < app.js` -le 90000
          test `wc -c < index-base.css` -le 25000
          test `wc -c < design-v2.css` -le 245000
          ! grep -q '<script[^>]*>[^<][[:space:][:print:]]*</script>' index.html
          ! grep -q '<style' index.html
          echo "Frontend architecture budgets OK"

      - name: Check patch formatting
        run: git diff --check

      - name: Check submission safety default
        run: grep -q '^OBSERVATIONS_SUBMISSION_ENABLED=false' .env.example

      - name: Check for committed API keys
        shell: bash
        run: |
          if grep -RIn --exclude-dir=.git --exclude=.gitignore -E 'AIza[0-9A-Za-z_-]{20,}' .; then
            echo "Potential Google API key detected in repository."
            exit 1
          fi
          if grep -RIn --exclude-dir=.git --exclude=.gitignore -E 'GEMINI_API_KEY[[:space:]]*=[[:space:]]*[^[:space:]]+' .; then
            echo "Potential hard-coded GEMINI_API_KEY detected in repository."
            exit 1
          fi
